# plymouthd 26.134.222 can hang on `plymouth quit` on hybrid NVIDIA laptops
# The stuck daemon keeps DRM master and blocks plymouth-quit-wait.service,
# so greetd never starts and the splash stays up forever. When the quit
# times out, SIGKILL plymouthd so the boot can continue.
[Service]
# A healthy quit plays the theme's end animation (81 frames, ~2.7s)
TimeoutSec=4
ExecStopPost=-/usr/bin/sh -c 'if [ "$$SERVICE_RESULT" = timeout ]; then echo "plymouth quit timed out, killing plymouthd" >&2; /usr/bin/pkill -KILL -x plymouthd; fi; exit 0'
